# Green Deployment 
apiVersion: apps/v1
kind: Deployment
metadata:
  name: green
  labels:
    app: httpd
  namespace: devops
spec:
  replicas: 3
  selector:
    matchLabels:
      app: httpd
      env: green
  template:
    metadata:
      labels:
        app: httpd
        env: green
    spec:
      containers:
        - name: httpd-container
          image: httpd:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
# Create service just after the deployment
apiVersion: v1
kind: Service
metadata:
  name: green
  namespace: devops
spec:
  type: NodePort
  selector:
    app: httpd
    env: green
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80